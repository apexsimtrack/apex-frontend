  <body>
    <div id="root"></div>
    <script>
      (function () {
        // A stale/missing entry chunk fails fast via the script "error" event.
        // This timeout is only a backstop for a bundle that loads but never
        // executes, so it has to sit well above a slow-network load time --
        // reloading a page that is merely still downloading restarts the
        // download and can never finish.
        var MOUNT_TIMEOUT_MS = 45000;
        var MAX_RECOVERY_RELOADS = 2;
        var COUNTER_KEY = "apex:boot-recovery-count";

        function readRecoveryCount() {
          try {
            return parseInt(sessionStorage.getItem(COUNTER_KEY), 10) || 0;
          } catch (e) {
            return 0;
          }
        }
        function writeRecoveryCount(value) {
          try {
            sessionStorage.setItem(COUNTER_KEY, String(value));
          } catch (e) {}
        }
        function clearRecoveryCount() {
          try {
            sessionStorage.removeItem(COUNTER_KEY);
          } catch (e) {}
        }

        function showOverlay(message, retryLabel) {
          var existing = document.getElementById("apex-reload-overlay");
          if (existing) existing.remove();
          var overlay = document.createElement("div");
          overlay.id = "apex-reload-overlay";
          overlay.style.cssText =
            "position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;font-family:sans-serif;font-size:18px;text-align:center;padding:24px;z-index:999999;";
          var text = document.createElement("p");
          text.style.cssText = "margin:0;max-width:32rem;line-height:1.5;";
          text.textContent = message;
          overlay.appendChild(text);
          if (retryLabel) {
            var button = document.createElement("button");
            button.type = "button";
            button.textContent = retryLabel;
            button.style.cssText =
              "appearance:none;border:1px solid rgba(255,255,255,0.3);border-radius:9999px;background:rgb(240,28,28);color:#fff;font:inherit;font-size:16px;padding:10px 24px;cursor:pointer;";
            button.addEventListener("click", function () {
              clearRecoveryCount();
              location.reload();
            });
            overlay.appendChild(button);
          }
          document.body.appendChild(overlay);
        }

        function recoverFromFailedBoot() {
          var attempts = readRecoveryCount();
          if (attempts >= MAX_RECOVERY_RELOADS) {
            showOverlay(
              "Apex could not finish loading. This is usually a slow or unstable connection.",
              "Try again",
            );
            return;
          }
          writeRecoveryCount(attempts + 1);
          showOverlay("Reloading (app failed to mount)...");
          var url = new URL(location.href);
          url.searchParams.set("__r", String(Date.now()));
          location.replace(url.toString());
        }

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              regs.forEach(function (reg) {
                reg.unregister();
              });
            })
            .catch(function () {});
        }
        if ("caches" in window) {
          caches
            .keys()
            .then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            })
            .catch(function () {});
        }

        var timeoutId = setTimeout(function () {
          if (window.__APEX_MOUNTED__ !== true) {
            recoverFromFailedBoot();
          }
        }, MOUNT_TIMEOUT_MS);

        var moduleScript =
          document.currentScript && document.currentScript.nextElementSibling;
        if (moduleScript && moduleScript.tagName === "SCRIPT") {
          moduleScript.addEventListener("error", function () {
            clearTimeout(timeoutId);
            recoverFromFailedBoot();
          });
        }

        var pollId = setInterval(function () {
          if (window.__APEX_MOUNTED__ !== true) return;
          clearInterval(pollId);
          clearTimeout(timeoutId);
          clearRecoveryCount();
          // Drop the cache-busting param so it is not carried into history or
          // copied out of the address bar.
          try {
            var url = new URL(location.href);
            if (url.searchParams.has("__r")) {
              url.searchParams.delete("__r");
              history.replaceState(history.state, "", url.toString());
            }
          } catch (e) {}
        }, 100);
      })();
    </script>
  </body>
